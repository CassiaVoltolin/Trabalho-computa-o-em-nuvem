version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./.env:/var/www/html/.env
    # As variáveis abaixo podem ser sobrescritas pelo arquivo .env mapeado acima
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-app_projeto}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: app_projeto
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
